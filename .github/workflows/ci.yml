name: Continuous Integration

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Python 3.12
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        
        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest dbt-snowflake

        - name: Run Pytest Suite
          run: pytest tests/ -m "not system and not integration"

        - name: Create dummy dbt profile
          run: |
            mkdir -p ~/.dbt
            cat > ~/.dbt/profiles.yml <<EOF
            clickstream_dbt:
              target: dev
              outputs:
                dev:
                  type: snowflake
                  account: dummy_account
                  user: dummy_user
                  password: dummy_password
                  role: dummy_role
                  database: CLICKSTREAM_DB
                  warehouse: COMPUTE_WH
                  schema: DEV
                  threads: 1
            EOF

        - name: Install dbt packages
          working-directory: dbt_clickstream
          run: dbt deps

        - name: Validate dbt Syntax
          working-directory: dbt_clickstream
          run: dbt parse